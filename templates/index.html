<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Sector Movers</title>
<style>
  :root {
    --bg: #0a1628;
    --panel: #0d1b2a;
    --panel2: #132035;
    --border: #2a3b55;
    --gold: #ffd700;
    --up: #00e676;
    --dn: #ff1744;
    --txt: #e8eef7;
    --dim: #93a4bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: "Segoe UI", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--gold);
    font-weight: 700;
  }
  #marketBadge {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }
  #marketBadge.open { background: rgba(0,230,118,.15); color: var(--up); }
  #marketBadge.closed { background: rgba(255,23,68,.15); color: var(--dn); }
  #updated { margin-left: auto; font-size: 12px; color: var(--dim); }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .panel-title {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1.5px;
    border-bottom: 1px solid var(--border);
  }
  #sectorList { list-style: none; overflow-y: auto; flex: 1; }
  #sectorList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(42,59,85,.5);
    transition: background .15s;
  }
  #sectorList li:hover { background: var(--panel2); }
  #sectorList li.active {
    background: var(--panel2);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  #sectorList .sname { font-size: 13px; }
  #sectorList .spct { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  section { padding: 16px 20px; overflow-y: auto; }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #sectorSelect {
    background: var(--panel2);
    color: var(--txt);
    border: 1px solid var(--border);
    padding: 9px 14px;
    font-size: 14px;
    border-radius: 6px;
    min-width: 260px;
  }
  #refreshBtn {
    background: var(--panel2);
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 9px 18px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
  }
  #refreshBtn:hover { border-color: var(--gold); }
  #errBanner {
    background: rgba(255,23,68,.12);
    border: 1px solid var(--dn);
    color: #ff8a9b;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 13px;
    word-break: break-word;
  }
  .hidden { display: none; }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 22px; }
  .tbl-col { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tbl-title {
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }
  .tbl-title.gain { color: var(--up); }
  .tbl-title.lose { color: var(--dn); }
  .full { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 11px;
    color: var(--dim);
    text-align: right;
    padding: 8px 12px;
    background: var(--panel2);
  }
  th:first-child, td:first-child { text-align: left; }
  td {
    padding: 8px 12px;
    font-size: 13px;
    text-align: right;
    border-top: 1px solid rgba(42,59,85,.4);
    font-variant-numeric: tabular-nums;
  }
  .rank { font-size: 11px; color: var(--dim); }
  .sym { font-weight: 700; }
  .sym a { color: inherit; text-decoration: none; }
  .sym a:hover { color: var(--gold); text-decoration: underline; }
  .gold { color: var(--gold); }
  .empty { text-align: center; color: var(--dim); padding: 20px; font-size: 13px; }
  footer { padding: 10px 16px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--border); background: var(--panel); }
</style>
</head>
<body>
  <header>
    <h1>NSE SECTOR MOVERS</h1>
    <span id="marketBadge" class="closed">LOADING…</span>
    <span id="updated"></span>
  </header>
  <main>
    <aside>
      <div class="panel-title">SECTORS · LIVE</div>
      <ul id="sectorList"><li class="empty">Loading sectors…</li></ul>
      <footer>Tap a sector to load its movers</footer>
    </aside>
    <section>
      <div class="controls">
        <select id="sectorSelect"><option>Loading…</option></select>
        <button id="refreshBtn">REFRESH</button>
      </div>
      <div id="errBanner" class="hidden"></div>
      <div class="tables">
        <div class="tbl-col">
          <div class="tbl-title gain">TOP GAINERS</div>
          <table id="gainersTable"><tr><td class="empty" colspan="4">Select a sector</td></tr></table>
        </div>
        <div class="tbl-col">
          <div class="tbl-title lose">TOP LOSERS</div>
          <table id="losersTable"><tr><td class="empty" colspan="4">Select a sector</td></tr></table>
        </div>
      </div>
      <div class="full">
        <div class="tbl-title">ALL CONSTITUENTS · SORTED BY % CHANGE</div>
        <table id="fullTable"><tr><td class="empty" colspan="5">Select a sector</td></tr></table>
      </div>
    </section>
  </main>

<script>
  const S = 15;                    // refresh seconds
  const $ = id => document.getElementById(id);
  let sectors = [];
  let selected = null;
  let timer = null;

  function fmt(v, d = 2, sign = false) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    const s = v.toFixed(d);
    return sign ? (v > 0 ? "+" + s : s) : s;
  }
  function pctClass(v) { return v > 0 ? "up" : v < 0 ? "dn" : ""; }
  function tvHref(sym) {
    return "https://www.tradingview.com/chart/?symbol=NSE:" + encodeURIComponent(sym);
  }

  function drawSectors(list) {
    const ul = $("sectorList");
    ul.innerHTML = "";
    if (!list.length) {
      ul.innerHTML = '<li class="empty">No sector data</li>';
      return;
    }
    const sel = $("sectorSelect");
    sel.innerHTML = "";
    list.forEach(s => {
      const li = document.createElement("li");
      li.className = selected === s.name ? "active" : "";
      li.innerHTML = '<span class="sname">' + s.name.replace("NIFTY ", "") + '</span>'
                   + '<span class="spct ' + pctClass(s.pChange) + '">' + fmt(s.pChange, 2, true) + "%</span>";
      li.onclick = () => { selected = s.name; sel.value = s.name; drawSectors(list); loadSector(); };
      ul.appendChild(li);
      const opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = s.name.replace("NIFTY ", "");
      sel.appendChild(opt);
    });
    if (selected) sel.value = selected;
  }

  function drawTable(tbl, rows, medals) {
    if (!rows.length) {
      tbl.innerHTML = '<tr><td class="empty" colspan="4">No stocks</td></tr>';
      return;
    }
    let h = '<tr><th>#</th><th>SYMBOL</th><th>PRICE</th><th>CHG%</th></tr>';
    rows.forEach((r, i) => {
      h += '<tr><td class="rank' + (medals && i < 3 ? " gold" : "") + '">' + (medals ? ["1","2","3"][i] || (i+1) : (i+1)) + '</td>'
         + '<td class="sym"><a href="' + tvHref(r.symbol) + '" target="_blank" rel="noopener">' + r.symbol + '</a></td>'
         + '<td class="' + pctClass(r.change) + '">' + fmt(r.price) + '</td>'
         + '<td class="' + pctClass(r.pChange) + '">' + fmt(r.pChange, 2, true) + '%</td></tr>';
    });
    tbl.innerHTML = h;
  }

  function drawFull(stocks) {
    const t = $("fullTable");
    if (!stocks.length) {
      t.innerHTML = '<tr><td class="empty" colspan="5">No stocks</td></tr>';
      return;
    }
    let h = '<tr><th>SYMBOL</th><th>PRICE</th><th>CHG%</th><th>VOLUME</th><th>VALUE (CR)</th></tr>';
    stocks.forEach(r => {
      h += '<tr><td class="sym"><a href="' + tvHref(r.symbol) + '" target="_blank" rel="noopener">' + r.symbol + '</a></td>'
         + '<td class="' + pctClass(r.change) + '">' + fmt(r.price) + '</td>'
         + '<td class="' + pctClass(r.pChange) + '">' + fmt(r.pChange, 2, true) + '%</td>'
         + '<td>' + (r.volume == null ? "—" : (r.volume / 100000).toFixed(1) + " L") + '</td>'
         + '<td>' + (r.turnover == null ? "—" : (r.turnover / 10000000).toFixed(2)) + '</td></tr>';
    });
    t.innerHTML = h;
  }

  function showErr(msg) {
    const b = $("errBanner");
    if (msg) { b.textContent = "⚠ " + msg; b.classList.remove("hidden"); }
    else b.classList.add("hidden");
  }

  async function loadSectors() {
    try {
      const res = await fetch("/api/sectors");
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "API error");
      const badge = $("marketBadge");
      const status = (j.marketStatus || "").toLowerCase();
      if (status.includes("open")) {
        badge.textContent = "MARKET OPEN";
        badge.className = "open";
      } else if (status) {
        badge.textContent = "MARKET CLOSED";
        badge.className = "closed";
      } else {
        badge.textContent = "STATUS UNKNOWN";
        badge.className = "closed";
      }
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
      sectors = j.sectors;
      if (!selected && sectors.length) selected = sectors[0].name;
      drawSectors(sectors);
      showErr(null);
      if (selected) loadSector();
    } catch (e) {
      showErr(e.message);
    }
  }

  async function loadSector() {
    if (!selected) return;
    try {
      const res = await fetch("/api/sector?name=" + encodeURIComponent(selected));
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "API error");
      drawTable($("gainersTable"), j.gainers, true);
      drawTable($("losersTable"), j.losers, true);
      drawFull(j.stocks);
      showErr(null);
    } catch (e) {
      showErr(e.message);
    }
  }

  $("sectorSelect").addEventListener("change", e => {
    selected = e.target.value;
    drawSectors(sectors);
    loadSector();
  });
  $("refreshBtn").addEventListener("click", () => { loadSectors(); });

  loadSectors();
  timer = setInterval(loadSectors, S * 1000);
</script>
</body>
</html>
